[project]
name = "lcx"
version = "0.1.0"
description = "Ladywood Circular Exchange - civic resource routing (runnable core)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "sqlmodel>=0.0.16",
                "pillow>=10.0", "python-multipart>=0.0.9", "pyyaml>=6.0",
                "celery[redis]>=5.3.0", "psycopg2-binary>=2.9.9", "geoalchemy2>=0.14.0",
                "boto3>=1.34.0", "python-jose[cryptography]>=3.3.0",
                "transformers>=4.37.0", "torch>=2.2.0", "requests>=2.31.0",
                "prometheus-fastapi-instrumentator>=7.0.0"]
[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
[tool.pytest.ini_options]
pythonpath = ["src"]
