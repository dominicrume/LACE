version: "3.8"

services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lcx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./config.yaml:/app/config.yaml
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A lcx.queue.celery_app worker --loglevel=info
    volumes:
      - ./src:/app/src
      - ./config.yaml:/app/config.yaml
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
      - redis
      - minio

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-create-bucket:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/lcx-images || true;
      /usr/bin/mc policy set public myminio/lcx-images || true;
      exit 0;
      "

volumes:
  pgdata:
  minio_data:
